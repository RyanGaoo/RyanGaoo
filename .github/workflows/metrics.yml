name: Metrics

on:
  # Rebuild daily so the numbers stay fresh
  schedule:
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Rebuild when this workflow changes
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics (includes private contributions)
        uses: lowlighter/metrics@latest
        with:
          # A Personal Access Token (classic: scopes "repo" + "read:user",
          # or fine-grained with read access to all your repos + profile).
          # Add it under Settings > Secrets and variables > Actions as METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          user: RyanGaoo
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Toronto

          # Count private repos/commits the token can see
          repositories_affiliations: owner, collaborator, organization_member
          repositories_skipped: ""

          # Full-year commit calendar + accurate commit totals
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most-used languages (includes private repos via the token)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes

          # Lines of code changed
          plugin_lines: yes
